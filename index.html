<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Fundamentals of Nursing </title>
    <style>
        /* ===== BASE ===== */
        :root {
            --bg1: #0a0e1a;
            --bg2: #141e33;
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --accent: #facc15;
            --danger: #f87171;
            --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5;
            --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px;
            --header-bg: rgba(255, 255, 255, 0.03);
            --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03);
            --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        [data-theme="light"] {
            --bg1: #f0f4f8;
            --bg2: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1);
            --text: #0f172a;
            --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7);
            --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04);
            --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        .highlight-text {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), #0f1a2b);
            min-height: 100vh;
            color: var(--text);
            padding: 16px 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.4s ease;
        }
        .app { max-width: 1100px; width: 100%; }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px 16px;
            background: var(--header-bg);
            border-radius: 20px;
            border: 1px solid var(--header-border);
            backdrop-filter: blur(4px);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15);
            transition: color 0.3s ease;
        }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .header .creator {
            color: var(--muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            transform: scale(1.05);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* ===== TABS ===== */
        .tabs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.3;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            color: var(--primary);
        }
        .tab-btn .en { display: block; font-size: 0.7rem; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.7; }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow), var(--glow);
            padding: 18px 14px;
            margin-bottom: 16px;
            transition: background 0.3s ease, border 0.3s ease;
            display: none;
        }
        .card.active { display: block; }
        .card h2 {
            font-size: 1.3rem;
            color: var(--text);
            border-right: 4px solid var(--primary);
            padding-right: 12px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* ===== SLIDES ===== */
        .slide-container {
            position: relative;
            min-height: 300px;
        }
        .slide {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .slide.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .slide-progress .bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin: 0 12px;
            overflow: hidden;
        }
        .slide-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .slide-progress .count {
            font-weight: 600;
            white-space: nowrap;
        }

        .slide-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .slide-nav .btn-nav {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            text-align: center;
        }
        .slide-nav .btn-nav:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.08);
            border-color: var(--primary);
        }
        .slide-nav .btn-nav:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .slide-nav .btn-nav.primary {
            background: var(--primary);
            color: #0a0e1a;
            border-color: var(--primary);
        }
        .slide-nav .btn-nav.primary:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        [data-theme="light"] .slide-nav .btn-nav {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* ===== CARDS GRID ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            margin-bottom: 8px;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 14px 12px;
            transition: border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .topic-card:hover { border-color: var(--primary); }

        .topic-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--card-title-bg);
        }
        .topic-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            line-height: 1.4;
            flex: 1;
        }
        .topic-card .card-title-ar {
            color: var(--muted);
            font-weight: 400;
            display: none;
        }
        .topic-card .card-title-ar.show { display: inline; }
        .topic-card .card-title-en { display: inline; }
        .topic-card .card-title-en.hidden { display: none; }

        .topic-card .translate-btn {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.6rem;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .topic-card .translate-btn:hover {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }
        .topic-card .translate-btn.active {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }

        .topic-card .card-items {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .topic-card .card-items li {
            padding: 4px 0 4px 0;
            line-height: 1.6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        [data-theme="light"] .topic-card .card-items li {
            border-bottom-color: rgba(0, 0, 0, 0.04);
        }
        .topic-card .card-items li:last-child { border-bottom: none; }

        /* ===== TTS: English text clickable ===== */
        .topic-card .item-en {
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.6;
            display: block;
            text-align: left;
            direction: ltr;
            cursor: pointer;
            transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px;
            padding: 1px 3px;
            margin-left: -3px;
        }
        .topic-card .item-en:hover {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.06);
        }
        .topic-card .item-en.speaking {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.12);
        }

        .topic-card .item-ar {
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            display: none;
            margin-top: 2px;
            padding-right: 8px;
            border-right: 2px solid rgba(0, 212, 255, 0.2);
        }
        .topic-card .item-ar.show { display: block; }

        .topic-card .card-items.numbered {
            counter-reset: item-counter;
        }
        .topic-card .card-items.numbered li {
            padding-right: 28px;
            position: relative;
            counter-increment: item-counter;
        }
        .topic-card .card-items.numbered li::before {
            content: counter(item-counter) "-";
            position: absolute;
            right: 2px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* ===== TABLES ===== */
        .info-table-wrap {
            overflow-x: auto;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            grid-column: 1 / -1;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 500px;
        }
        .info-table th {
            background: var(--table-header-bg);
            color: var(--primary);
            padding: 8px 6px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            font-weight: 700;
        }
        .info-table td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--card-border);
            vertical-align: top;
            line-height: 1.5;
        }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text {
            border-right: none;
            padding-right: 0;
            margin-top: 2px;
            font-size: 0.78rem;
            display: block;
            color: var(--muted);
        }
        .info-table .en-text {
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px;
            padding: 1px 3px;
            margin-left: -3px;
            display: inline-block;
            text-align: left;
            direction: ltr;
        }
        .info-table .en-text:hover {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.06);
        }
        .info-table .en-text.speaking {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.12);
        }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            .info-table { font-size: 0.72rem; min-width: 350px; }
            .topic-card .card-title { font-size: 0.85rem; }
        }

        .footer-credit {
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.7rem;
            margin-top: 24px;
            padding: 10px 0;
            border-top: 1px solid var(--footer-border);
        }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit .name { color: var(--primary); font-weight: 600; }

        @media (max-width: 768px) {
            body { padding: 8px 4px; }
            .header h1 { font-size: 1.4rem; }
            .tab-btn { padding: 6px 10px; font-size: 0.6rem; }
            .card { padding: 14px 10px; }
            .card h2 { font-size: 1.1rem; }
        }

        .topic-card.full-width { grid-column: 1 / -1; }

        /* ===== PDF DOWNLOAD BUTTON ===== */
        .pdf-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }
        .pdf-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: var(--danger);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1><span class="highlight">Fundamentals of Nursing</span></h1>
                    <div class="sub"> أساسيات تمريض نظري</div>
                    <div class="creator">Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">☀</button>
            </div>
        </div>

        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">
            Created by <span class="name">MR. YASSIN THARWAT</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  THEME
        // ================================================================
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☾' : '☀';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        // ================================================================
        //  SLIDE SYSTEM
        // ================================================================
        let slideState = {};

        function initSlideState(partId, totalSlides) {
            slideState[partId] = { current: 0, total: totalSlides };
        }

        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) progressBar.style.width = ((state.current + 1) / state.total * 100) + '%';
            if (countSpan) countSpan.textContent = `${state.current + 1} / ${state.total}`;
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }

        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function stripHTML(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function createSlideHTML(title, cardsHTML) {
            return `
                <div class="slide">
                    <h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3>
                    <div class="cards-grid">${cardsHTML}</div>
                </div>
            `;
        }

        function card(title, items, arTitle = '') {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `<li><span class="item-en" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="item-ar">${ar}</span></li>`;
            }).join('');
            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';
            return `
                <div class="topic-card" data-card="${cardId}">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span>
                        </span>
                        <button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">ترجمة</button>
                    </div>
                    <ul class="${listClass}">${itemsHTML}</ul>
                </div>
            `;
        }

        function tableCard(title, tableHTML, arTitle = '') {
            return `
                <div class="topic-card full-width">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" style="display:block;">${arTitle}</span>
                        </span>
                    </div>
                    <div class="info-table-wrap">${tableHTML}</div>
                </div>
            `;
        }

        function cell(en, ar) {
            return `<span class="en-text" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="ar-text">${ar}</span>`;
        }

        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');
            arItems.forEach(el => el.classList.toggle('show'));
            if (titleAr) {
                titleAr.classList.toggle('show');
                if (titleEn) titleEn.classList.toggle('hidden');
            }
            if (btn) {
                btn.textContent = isVisible ? 'ترجمة' : 'إخفاء';
                btn.classList.toggle('active');
            }
        }

        // ================================================================
        //  TEXT-TO-SPEECH (TTS)
        // ================================================================
        function initTTS() {
            if (!window.speechSynthesis) return;
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {};
            }
            document.addEventListener('click', function(e) {
                const target = e.target.closest('.item-en, .en-text');
                if (!target) return;
                if (e.target.closest('.translate-btn')) return;
                const text = (target.getAttribute('data-text') || target.textContent || '').trim();
                if (!text) return;
                speakText(text, target);
            });
        }

        function speakText(text, element) {
            const synth = window.speechSynthesis;
            if (!synth) return;
            synth.cancel();
            document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = synth.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'))
                || voices.find(v => v.lang.startsWith('en-US'))
                || voices.find(v => v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;

            utterance.onstart = () => { if (element) element.classList.add('speaking'); };
            utterance.onend = () => { if (element) element.classList.remove('speaking'); };
            utterance.onerror = () => { if (element) element.classList.remove('speaking'); };
            synth.speak(utterance);
        }

        // ================================================================
        //  PDF DOWNLOAD — FINAL FIX: single-column flow, no forced breaks
        //  → No blank pages
        //  → No one-line pages
        // ================================================================
        function downloadPDF(sectionId) {
            const sec = slidesData[sectionId];
            if (!sec) return;

            let allSlidesHTML = '';
            sec.slides.forEach((slide) => {
                let cardsHTML = '';
                if (slide.cards) {
                    slide.cards.forEach(c => { cardsHTML += c; });

                            { en: '<span class="highlight-text">Surface temperature:</span> is the temperature of the skin, the subcutaneous tissue, & fat. It rises & falls in response to the environment.', ar: '<span class="highlight-text">درجة حرارة السطح:</span> هي درجة حرارة الجلد، الأنسجة تحت الجلد، والدهون. ترتفع وتنخفض استجابةً للبيئة.' },
                            { en: 'Heat production: Heat is produced in the body\'s cells through food metabolism that results in the release of energy.', ar: 'إنتاج الحرارة: تُنتج الحرارة في خلايا الجسم من خلال استقلاب الطعام الذي يؤدي إلى إطلاق الطاقة.' }

                            { en: '1. <span class="highlight-text">Basal metabolic rate:</span> is the rate of energy utilization in the body required to maintain essential activity such as breathing. Metabolic rate decreases with age. In general, the younger the person, the higher the metabolic rate.', ar: '1. <span class="highlight-text">معدل الأيض الأساسي:</span> هو معدل استخدام الطاقة في الجسم المطلوب للحفاظ على النشاط الأساسي مثل التنفس. ينخفض معدل الأيض مع العمر. بشكل عام، كلما كان الشخص أصغر سناً كان معدل الأيض أعلى.' },

                            { en: '2) <span class="highlight-text">Diurnal variations:</span> Body temperature normally changes throughout the day, varying as much as 1.0° between early morning & the late afternoon. Highest body temperature point usually reached between 8 pm & midnight. Lowest body temperature point usually reached during sleep between 4 am & 6 am.', ar: '2) <span class="highlight-text">التغيرات اليومية:</span> تتغير درجة حرارة الجسم عادة على مدار اليوم، وتتفاوت بما يصل إلى 1.0 درجة بين الصباح الباكر وبعد الظهر المتأخر. عادة ما يتم الوصول إلى أعلى نقطة لدرجة حرارة الجسم بين الساعة 8 مساءً ومنتصف الليل. عادة ما يتم الوصول إلى أدنى نقطة لدرجة حرارة الجسم أثناء النوم بين الساعة 4 صباحاً و 6 صباحاً.' },

                            { en: '5) <span class="highlight-text">Stress:</span> Stimulation of sympathetic nervous system can increase production of epinephrine & norepinephrine leading to an increase of metabolic activity & heat production.', ar: '5) <span class="highlight-text">التوتر:</span> تحفيز الجهاز العصبي السمبثاوي يمكن أن يزيد من إنتاج الإبينفرين والنورإبينفرين مما يؤدي إلى زيادة النشاط الأيضي وإنتاج الحرارة.' },

                        card('Types of Breathing & Mechanics · أنواع التنفس والميكانيكا', [
                            { en: '1) <span class="highlight-text">Costal (thoracic) breathing:</span> Involves the external intercostal muscles & other muscles. It can be observed by the movement of chest upward & outward.', ar: '1) <span class="highlight-text">التنفس الضلعي (الصدري):</span> يشمل العضلات الوربية الخارجية والعضلات الأخرى. يمكن ملاحظته من خلال حركة الصدر للأعلى وللخارج.' },
                            { en: '2) <span class="highlight-text">Diaphragmatic (abdominal) breathing:</span> Involves contraction & relaxation of diaphragm. It\'s observed by movement of abdomen (downward).', ar: '2) <span class="highlight-text">التنفس الحجابي (البطني):</span> يشمل انقباض واسترخاء الحجاب الحاجز. يُلاحظ من خلال حركة البطن (للأسفل).' },

                {

                    cards: [

                            { en: '<span class="highlight-text">Respiratory Rate:</span> The respiratory rate of a normal healthy adult ranges from <span class="highlight-text">12 to 20 respirations per minute</span>.', ar: '<span class="highlight-text">معدل التنفس:</span> يتراوح معدل التنفس للبالغ الصحي الطبيعي من <span class="highlight-text">12 إلى 20 نفساً في الدقيقة</span>.' },
                            { en: '<span class="highlight-text">Tachypnea:</span> An abnormal increase in the respiratory rate of more than <span class="highlight-text">20 respirations per minute</span>.', ar: '<span class="highlight-text">تسرع التنفس:</span> زيادة غير طبيعية في معدل التنفس أكثر من <span class="highlight-text">20 نفساً في الدقيقة</span>.' },
                            { en: '<span class="highlight-text">Bradypnea:</span> An abnormal decrease in the respiratory rate of less than <span class="highlight-text">12 respirations per minute</span>.', ar: '<span class="highlight-text">بطء التنفس:</span> انخفاض غير طبيعي في معدل التنفس أقل من <span class="highlight-text">12 نفساً في الدقيقة</span>.' },
                            { en: '<span class="highlight-text">Rhythm of Respiration:</span> Normally the rhythm should be even and regular, the pauses between inhalation and exhalation should be equal. If the patient complains from respiratory disorder the rhythm becomes irregular.', ar: '<span class="highlight-text">إيقاع التنفس:</span> عادة يجب أن يكون الإيقاع متساوياً ومنتظماً، يجب أن تكون الفواصل بين الشهيق والزفير متساوية. إذا كان المريض يعاني من اضطراب تنفسي يصبح الإيقاع غير منتظم.' },
                            { en: '<span class="highlight-text">Depth of Respiration:</span> Is generally described as normal, deep, or shallow and is determined by observing the amount of movement of the chest. The depth of respiration indicates the amount of air that is inhaled or exhaled during the process of breathing.', ar: '<span class="highlight-text">عمق التنفس:</span> يوصف عموماً بأنه طبيعي، عميق، أو ضحل ويتم تحديده من خلال ملاحظة مقدار حركة الصدر. يشير عمق التنفس إلى كمية الهواء التي يتم استنشاقها أو زفيرها أثناء عملية التنفس.' }

                            { en: '2. <span class="highlight-text">Physical activity:</span> Physical activity increases the respiratory rate temporarily.', ar: '2. <span class="highlight-text">النشاط البدني:</span> يزيد النشاط البدني من معدل التنفس مؤقتاً.' },
                            { en: '3. <span class="highlight-text">Emotional states:</span> Strong emotional states temporarily increase the respiratory rate.', ar: '3. <span class="highlight-text">الحالات العاطفية:</span> الحالات العاطفية القوية تزيد معدل التنفس مؤقتاً.' },
                            { en: '4. <span class="highlight-text">Fever:</span> A patient with a fever has an increased respiratory rate. One way that heat is lost from the body is through the lungs; a fever causes an increased respiratory rate as the body tries to rid itself of the excess heat.', ar: '4. <span class="highlight-text">الحمى:</span> المريض المصاب بالحمى لديه معدل تنفس متزايد. إحدى طرق فقدان الحرارة من الجسم هي عبر الرئتين؛ تسبب الحمى زيادة معدل التنفس حيث يحاول الجسم التخلص من الحرارة الزائدة.' },

                            { en: '1. <span class="highlight-text">Apnea:</span> Absence of breathing.', ar: '1. <span class="highlight-text">انقطاع النفس:</span> غياب التنفس.' },
                            { en: '2. <span class="highlight-text">Orthopnea:</span> Only able to breathe comfortably in upright position (such as sitting in chair), but unable to breathe laying down.', ar: '2. <span class="highlight-text">ضيق التنفس في وضع الاستلقاء:</span> القدرة على التنفس بشكل مريح فقط في وضع مستقيم (مثل الجلوس على كرسي)، ولكن عدم القدرة على التنفس عند الاستلقاء.' },
                            { en: '3. <span class="highlight-text">Dyspnea:</span> Subjective sensation related by patient as to breathing difficulty.', ar: '3. <span class="highlight-text">ضيق التنفس:</span> إحساس ذاتي يذكره المريض بصعوبة التنفس.' },
                            { en: '4. <span class="highlight-text">Paroxysmal nocturnal dyspnea:</span> attacks of severe shortness of breath that wakes a person from sleep, such that they have to sit up to catch their breath - common in patients with congestive heart failure.', ar: '4. <span class="highlight-text">ضيق التنفس الليلي الانتيابي:</span> نوبات من ضيق التنفس الشديد الذي يوقظ الشخص من النوم، لدرجة أنه يضطر إلى الجلوس لالتقاط أنفاسه - شائع في المرضى الذين يعانون من قصور القلب الاحتقاني.' },
                            { en: '5. <span class="highlight-text">Hyperpnea:</span> Increased depth of breathing. Increased volume with or without an increased frequency (RR), normal blood gases present.', ar: '5. <span class="highlight-text">فرط التنفس:</span> زيادة عمق التنفس. زيادة الحجم مع أو بدون زيادة في التردد (RR)، غازات الدم طبيعية.' },
                            { en: '6. <span class="highlight-text">Hyperventilation:</span> Increased rate or depth, or combination of both.', ar: '6. <span class="highlight-text">فرط التهوية:</span> زيادة المعدل أو العمق، أو مزيج من كليهما.' },
                            { en: '7. <span class="highlight-text">Hypoventilation:</span> Decreased rate or depth, or some combination of both.', ar: '7. <span class="highlight-text">نقص التهوية:</span> انخفاض المعدل أو العمق، أو مزيج من كليهما.' },
                            { en: '8. <span class="highlight-text">Tachypnea:</span> Increased frequency without blood gas abnormality.', ar: '8. <span class="highlight-text">تسرع التنفس:</span> زيادة التردد دون وجود خلل في غازات الدم.' },
                            { en: '9. <span class="highlight-text">Kussmaul\'s respiration:</span> Increased rate and depth of breathing over a prolonged period of time.', ar: '9. <span class="highlight-text">تنفس كوسماول:</span> زيادة معدل وعمق التنفس على مدى فترة طويلة من الزمن.' },

                {
                    title: 'Blood Pressure — Objectives, Definitions & Hemodynamic Regulators · ضغط الدم — الأهداف والتعريفات والمنظمات',
                    cards: [
                        card('Objectives & Definitions · الأهداف والتعريفات', [
                            { en: '1. Define blood pressure and pulse pressure.', ar: '1. تعريف ضغط الدم وضغط النبض.' },
                            { en: '2. List four hemodynamic regulators for blood pressure control.', ar: '2. سرد أربعة منظمات ديناميكية دموية للتحكم في ضغط الدم.' },
                            { en: '3. Identify the mechanism of maintaining normal blood pressure.', ar: '3. تحديد آلية الحفاظ على ضغط الدم الطبيعي.' },
                            { en: '4. List and describe methods of blood pressure measurement technique.', ar: '4. سرد ووصف طرق تقنية قياس ضغط الدم.' },
                            { en: '5. List and describe sites for blood pressure measurement.', ar: '5. سرد ووصف مواقع قياس ضغط الدم.' },
                            { en: '6. List and describe factors that affect the blood pressure.', ar: '6. سرد ووصف العوامل التي تؤثر على ضغط الدم.' },
                            { en: '7. List abnormal blood pressure readings.', ar: '7. سرد قراءات ضغط الدم غير الطبيعية.' },
                            { en: '8. Identify categories for blood pressure levels in adults.', ar: '8. تحديد فئات مستويات ضغط الدم للبالغين.' },
                            { en: '<span class="highlight-text">Blood pressure</span> is the measurement of pressure pulsations exerted against the blood vessel walls during systole and diastole. It is measured in terms of <span class="highlight-text">millimeters of mercury (mm Hg)</span>.', ar: '<span class="highlight-text">ضغط الدم</span> هو قياس نبضات الضغط المبذولة على جدران الأوعية الدموية أثناء الانقباض والانبساط. يقاس بوحدات <span class="highlight-text">ملليمترات الزئبق (ملم زئبق)</span>.' },
                            { en: '<span class="highlight-text">Arterial blood pressure:</span> is a measure of the pressure exerted by the blood against arterial walls during contraction of the ventricles of the heart.', ar: '<span class="highlight-text">ضغط الدم الشرياني:</span> هو قياس الضغط المبذول من الدم على جدران الشرايين أثناء انقباض بطينات القلب.' },
                            { en: '<span class="highlight-text">Pulse Pressure:</span> The difference between systolic and diastolic pressure. It is determined by subtracting the diastole from the systole. If the blood pressure is 110/70 mm Hg, the pulse pressure would be <span class="highlight-text">40 mm Hg</span>.', ar: '<span class="highlight-text">ضغط النبض:</span> الفرق بين الضغط الانقباضي والانبساطي. يتم تحديده بطرح الانبساطي من الانقباضي. إذا كان ضغط الدم 110/70 ملم زئبق، فإن ضغط النبض سيكون <span class="highlight-text">40 ملم زئبق</span>.' }
                        ], 'الأهداف والتعريفات:'),
                        card('Four Hemodynamic Regulators of BP · المنظمات الأربعة لضغط الدم', [
                            { en: '1. <span class="highlight-text">Blood volume:</span> the volume of blood in the circulatory system. Hemorrhage causes a loss in blood volume that, in turn, lowers the blood pressure. Rapid infusion of intravenous fluids causes an increase in volume and a subsequent rise in pressure.', ar: '1. <span class="highlight-text">حجم الدم:</span> حجم الدم في الجهاز الدوري. يسبب النزيف فقداناً في حجم الدم مما يؤدي بدوره إلى خفض ضغط الدم. يؤدي الحقن السريع للسوائل الوريدية إلى زيادة الحجم وارتفاع لاحق في الضغط.' },
                            { en: '2. <span class="highlight-text">Cardiac output:</span> is the volume of blood pumped by the heart in 1 minute. Anything that decreases cardiac output, also decreases blood pressure, because there is less pressure on the vessel walls. An increase in cardiac output results in increased blood pressure. <span class="highlight-text">Cardiac Output = Heart Rate × Stroke Volume</span>. Stroke volume is the measurement of blood that enters the aorta with each ventricular contraction. With each ventricular contraction, the heart ejects 60 to 70 mL of blood into the aorta. For example, a patient with a heart rate of 80 beats per minute, times a stroke volume of 60 mL of blood would have a cardiac output of <span class="highlight-text">4,800 mL</span>.', ar: '2. <span class="highlight-text">نتاج القلب:</span> هو حجم الدم الذي يضخه القلب في دقيقة واحدة. أي شيء يقلل من نتاج القلب، يقلل أيضاً من ضغط الدم، لأن هناك ضغطاً أقل على جدران الأوعية. تؤدي الزيادة في نتاج القلب إلى زيادة ضغط الدم. <span class="highlight-text">نتاج القلب = معدل ضربات القلب × حجم الضربة</span>. حجم الضربة هو قياس الدم الذي يدخل الشريان الأورطي مع كل انقباض بطيني. مع كل انقباض بطيني، يدفع القلب 60 إلى 70 مل من الدم إلى الشريان الأورطي. على سبيل المثال، المريض الذي يبلغ معدل ضربات قلبه 80 نبضة في الدقيقة، وضرب حجم ضربة 60 مل من الدم سيكون لديه نتاج قلبي قدره <span class="highlight-text">4,800 مل</span>.' },
                            { en: '3. <span class="highlight-text">Peripheral vascular resistance:</span> the size and distensibility of the arteries, which is the most important determinant of diastolic pressure. Arterial resistance (decreased distensibility) is encountered when the left ventricle pumps blood from the heart under pressure during the systolic phase.', ar: '3. <span class="highlight-text">المقاومة الوعائية المحيطية:</span> حجم وتمدد الشرايين، وهو أهم محدد للضغط الانبساطي. تُواجه المقاومة الشريانية (انخفاض التمدد) عندما يضخ البطين الأيسر الدم من القلب تحت الضغط أثناء مرحلة الانقباض.' },
                            { en: '4. <span class="highlight-text">Viscosity:</span> the thickness of the blood. The greater the viscosity, the harder the heart must work to pump blood, with a resultant increase in blood pressure. When the proportion of the red blood cells to the blood plasma is high then it is referred to as <span class="highlight-text">Hematocrit</span>. Viscosity increases markedly when the Hematocrit is more than <span class="highlight-text">60-65%</span>.', ar: '4. <span class="highlight-text">اللزوجة:</span> سماكة الدم. كلما زادت اللزوجة، كلما كان على القلب العمل بجهد أكبر لضخ الدم، مما يؤدي إلى زيادة ضغط الدم. عندما تكون نسبة خلايا الدم الحمراء إلى بلازما الدم عالية فإنها يشار إليها باسم <span class="highlight-text">الهيماتوكريت</span>. تزداد اللزوجة بشكل ملحوظ عندما يكون الهيماتوكريت أكثر من <span class="highlight-text">60-65%</span>.' }
                        ], 'المنظمات الأربعة:')

                {
                    title: 'Mechanism of Maintaining Normal BP & Factors Affecting · آلية الحفاظ على الضغط والعوامل المؤثرة',
                    cards: [
                        card('Mechanism of Maintaining Normal BP · آلية الحفاظ على الضغط الطبيعي', [
                            { en: '<span class="highlight-text">Systolic blood pressure</span> is a measurement of the maximal pressure exerted against arterial walls during systole (when myocardial fibers contract and tighten to eject blood from the ventricles), primarily a reflection of <span class="highlight-text">cardiac output</span>.', ar: '<span class="highlight-text">ضغط الدم الانقباضي</span> هو قياس أقصى ضغط يتم بذله على جدران الشرايين أثناء الانقباض (عندما تنقبض ألياف عضلة القلب وتشد لدفع الدم من البطينين)، وهو في المقام الأول انعكاس لـ<span class="highlight-text">نتاج القلب</span>.' },
                            { en: '<span class="highlight-text">Diastolic blood pressure</span> is a measurement of pressure remaining in the arterial system during diastole (period of relaxation that reflects the pressure remaining in the blood vessels after the heart has pumped), primarily a reflection of <span class="highlight-text">peripheral vascular resistance</span>.', ar: '<span class="highlight-text">ضغط الدم الانبساطي</span> هو قياس الضغط المتبقي في النظام الشرياني أثناء الانبساط (فترة الاسترخاء التي تعكس الضغط المتبقي في الأوعية الدموية بعد ضخ القلب)، وهو في المقام الأول انعكاس لـ<span class="highlight-text">المقاومة الوعائية المحيطية</span>.' },
                            { en: 'The average of blood pressure for adults is <span class="highlight-text">120/80 mmHg</span>.', ar: 'متوسط ضغط الدم للبالغين هو <span class="highlight-text">120/80 ملم زئبق</span>.' }
                        ], 'آلية الحفاظ على الضغط:'),
                        card('Factors Affecting Blood Pressure · العوامل المؤثرة على ضغط الدم', [
                            { en: '1) <span class="highlight-text">Age:</span> Pressure rises with age, reaching a peak at the onset of puberty & then tends to decline. In older people, elasticity of arteries decreases & tends to be more rigid & less yielding to the pressure of blood & this produces an elevated systolic pressure. When walls also no longer retract as flexibly with decreased pressure, the diastolic pressure increases.', ar: '1) <span class="highlight-text">العمر:</span> يرتفع الضغط مع العمر، ويصل إلى ذروته عند بداية البلوغ ثم يميل إلى الانخفاض. في كبار السن، تقل مرونة الشرايين وتميل إلى أن تكون أكثر صلابة وأقل استجابة لضغط الدم وهذا ينتج ضغطاً انقباضياً مرتفعاً. عندما لا تعود الجدران تنقبض بمرونة مع انخفاض الضغط، يزداد الضغط الانبساطي.' },
                            { en: '2) <span class="highlight-text">Exercise:</span> Physical activity increases the cardiac output & blood pressure. It\'s recommended to measure blood pressure after <span class="highlight-text">20-30 min of resting</span> from exercise.', ar: '2) <span class="highlight-text">التمرين:</span> يزيد النشاط البدني من نتاج القلب وضغط الدم. يوصى بقياس ضغط الدم بعد <span class="highlight-text">20-30 دقيقة من الراحة</span> بعد التمرين.' },
                            { en: '3) <span class="highlight-text">Stress:</span> When sympathetic nervous system is stimulated, cardiac output & vasoconstriction of arteries increase, leading to an increase in blood pressure reading. In cases of severe pain, blood pressure may decrease greatly & cause shock by inhibiting the vasomotor center & producing vasodilatation.', ar: '3) <span class="highlight-text">التوتر:</span> عندما يتم تحفيز الجهاز العصبي السمبثاوي، يزداد نتاج القلب وتضيق الشرايين، مما يؤدي إلى زيادة قراءة ضغط الدم. في حالات الألم الشديد، قد ينخفض ضغط الدم بشكل كبير ويسبب صدمة عن طريق تثبيط مركز الأوعية الدموية وإنتاج توسع الأوعية.' },
                            { en: '4) <span class="highlight-text">Race:</span> African American males over 35 years have higher blood pressure than European American males of the same age.', ar: '4) <span class="highlight-text">العرق:</span> الذكور الأمريكيون الأفارقة الذين تزيد أعمارهم عن 35 عاماً لديهم ضغط دم أعلى من الذكور الأمريكيين الأوروبيين من نفس العمر.' },
                            { en: '5) <span class="highlight-text">Obesity:</span> In general obese people have a higher blood pressure than normal weight.', ar: '5) <span class="highlight-text">السمنة:</span> بشكل عام الأشخاص البدناء لديهم ضغط دم أعلى من الوزن الطبيعي.' },
                            { en: '6) <span class="highlight-text">Sex:</span> After puberty females usually have lower blood pressure than males of the same age due to hormonal changes. After menopause women have higher blood pressure than before.', ar: '6) <span class="highlight-text">الجنس:</span> بعد البلوغ عادة ما يكون لدى الإناث ضغط دم أقل من الذكور من نفس العمر بسبب التغيرات الهرمونية. بعد انقطاع الطمث يكون لدى النساء ضغط دم أعلى من ذي قبل.' },
                            { en: '7) <span class="highlight-text">Medications:</span> Many medications may increase or decrease blood pressure.', ar: '7) <span class="highlight-text">الأدوية:</span> العديد من الأدوية قد تزيد أو تقلل ضغط الدم.' },
                            { en: '8) <span class="highlight-text">Diurnal variations:</span> Blood pressure usually is low in early morning (↓ metabolic rate).', ar: '8) <span class="highlight-text">التغيرات اليومية:</span> عادة ما يكون ضغط الدم منخفضاً في الصباح الباكر (انخفاض معدل الأيض).' },
                            { en: '9) <span class="highlight-text">Disease process:</span> Any condition affecting cardiac output, blood volume, blood viscosity & compliance of arteries, has a direct effect on the blood pressure.', ar: '9) <span class="highlight-text">العملية المرضية:</span> أي حالة تؤثر على نتاج القلب، حجم الدم، لزوجة الدم ومرونة الشرايين، لها تأثير مباشر على ضغط الدم.' }
                        ], 'العوامل المؤثرة:')
                    ]
                },
                {
                    title: 'Sphygmomanometers, Measurement Sites & Common Errors · أجهزة القياس والمواقع والأخطاء الشائعة',
                    cards: [
                        card('Types of Sphygmomanometers · أنواع أجهزة قياس ضغط الدم', [
                            { en: 'The three types of sphygmomanometers are the <span class="highlight-text">aneroid, mercury and electronic</span>.', ar: 'الأنواع الثلاثة لأجهزة قياس ضغط الدم هي <span class="highlight-text">الأنيرويد والزئبقي والإلكتروني</span>.' },
                            { en: '<span class="highlight-text">1. Aneroid Sphygmomanometer:</span> The aneroid sphygmomanometer is lightweight and portable, has a manometer gauge with a round scale. The scale is calibrated in millimeters, with a needle that points to the calibrations.', ar: '<span class="highlight-text">1. جهاز قياس ضغط الدم الأنيرويد:</span> جهاز قياس ضغط الدم الأنيرويد خفيف الوزن ومحمول، يحتوي على مقياس ضغط بمقياس دائري. تمت معايرة المقياس بالملليمترات، مع إبرة تشير إلى المعايرات.' },
                            { en: '<span class="highlight-text">2. Mercury Sphygmomanometer:</span> The mercury sphygmomanometer has a vertical tube calibrated in millimeters that is filled with mercury. It is <span class="highlight-text">more accurate</span> than the aneroid sphygmomanometer.', ar: '<span class="highlight-text">2. جهاز قياس ضغط الدم الزئبقي:</span> يحتوي جهاز قياس ضغط الدم الزئبقي على أنبوب عمودي معاير بالملليمترات مملوء بالزئبق. وهو <span class="highlight-text">أكثر دقة</span> من جهاز قياس ضغط الدم الأنيرويد.' },
                            { en: '<span class="highlight-text">3. Electronic sphygmomanometers</span> (Digital blood pressure measuring instrument): Are used by patients for self-measurements. A stethoscope is not required because the device electronically inflates and deflates the cuff while simultaneously reading and displaying the systolic and diastolic pressures. The electronic device is useful for patients who must monitor their own pressure at home.', ar: '<span class="highlight-text">3. أجهزة قياس ضغط الدم الإلكترونية</span> (أداة قياس ضغط الدم الرقمية): يستخدمها المرضى للقياسات الذاتية. لا يلزم وجود سماعة طبية لأن الجهاز ينفخ ويفرغ الكفة إلكترونياً أثناء قراءة وعرض الضغط الانقباضي والانبساطي في وقت واحد. الجهاز الإلكتروني مفيد للمرضى الذين يجب عليهم مراقبة ضغطهم في المنزل.' },
                            { en: 'The aneroid gauge needle or mercury in the manometer column should be at a <span class="highlight-text">zero reading</span> when the cuff is deflated and should rise evenly when pressure is applied to the bulb. The valve should turn freely, and all tubing should be intact, with secured connections to prevent air from leaking out of the system.', ar: 'يجب أن تكون إبرة مقياس الأنيرويد أو الزئبق في عمود مقياس الضغط عند <span class="highlight-text">قراءة صفر</span> عندما تكون الكفة مفرغة من الهواء ويجب أن ترتفع بشكل متساوٍ عند تطبيق الضغط على البصلة. يجب أن يدور الصمام بحرية، ويجب أن تكون جميع الأنابيب سليمة، مع توصيلات آمنة لمنع تسرب الهواء من النظام.' }
                        ], 'أجهزة القياس:'),
                        card('Sites Used to Measure Blood Pressure · المواقع المستخدمة لقياس ضغط الدم', [
                            { en: '1. From the arm (<span class="highlight-text">brachial artery</span>).', ar: '1. من الذراع (<span class="highlight-text">الشريان العضدي</span>).' },
                            { en: '2. From the leg (thigh) (<span class="highlight-text">popliteal artery</span>).', ar: '2. من الساق (الفخذ) (<span class="highlight-text">الشريان المأبضي</span>).' },
                            { en: '3. Other sites by palpation.', ar: '3. مواقع أخرى عن طريق الجس.' }
                        ], 'المواقع:'),
                        card('Common Errors in Assessing BP · الأخطاء الشائعة في تقييم ضغط الدم', [
                            { en: '1. Bladder cuff is too narrow or too wide.', ar: '1. كفة المثانة ضيقة جداً أو واسعة جداً.' },
                            { en: '2. Arm unsupported.', ar: '2. الذراع غير مدعومة.' },
                            { en: '3. Insufficient rest before assessment.', ar: '3. راحة غير كافية قبل التقييم.' },
                            { en: '4. Repeating assessment too quickly.', ar: '4. تكرار التقييم بسرعة كبيرة.' },
                            { en: '5. Cuff wrapped too loosely.', ar: '5. الكفة ملفوفة بشكل غير محكم.' },
                            { en: '6. Deflating cuff too quickly or too slowly.', ar: '6. تفريغ الكفة بسرعة كبيرة أو ببطء شديد.' },
                            { en: '7. Arm above the level of the heart (sphygmomanometer must be at the level of left ventricle & brachial artery).', ar: '7. الذراع فوق مستوى القلب (يجب أن يكون مقياس ضغط الدم على مستوى البطين الأيسر والشريان العضدي).' },
                            { en: '8. Assessing immediately after meal or while patient smokes or has pain.', ar: '8. التقييم مباشرة بعد تناول الطعام أو أثناء تدخين المريض أو شعوره بالألم.' }
                        ], 'الأخطاء الشائعة:')
                    ]
                },
                {
                    title: 'Abnormal Blood Pressure & Categories in Adults · ضغط الدم غير الطبيعي وفئاته للبالغين',
                    cards: [
                        card('Abnormal Blood Pressure Readings · قراءات ضغط الدم غير الطبيعية', [
                            { en: '<span class="highlight-text">Hypertension</span> (high blood pressure): results from excessive pressure on the walls of the arteries. Is determined by a sustained systolic blood pressure reading of <span class="highlight-text">140 mmHg or greater</span> or a sustained diastolic reading of <span class="highlight-text">90 mmHg or greater</span>.', ar: '<span class="highlight-text">ارتفاع ضغط الدم:</span> ينتج عن ضغط مفرط على جدران الشرايين. يتم تحديده من خلال قراءة ضغط دم انقباضي مستمرة تبلغ <span class="highlight-text">140 ملم زئبق أو أكثر</span> أو قراءة انبساطية مستمرة تبلغ <span class="highlight-text">90 ملم زئبق أو أكثر</span>.' },
                            { en: '<span class="highlight-text">Hypotension</span> (low blood pressure): results from reduced pressure on the arterial walls. Hypotension is determined by a blood pressure reading less than <span class="highlight-text">95/60 mmHg</span> or <span class="highlight-text">20 to 30 mmHg below</span> the patient\'s normal systolic pressure.', ar: '<span class="highlight-text">انخفاض ضغط الدم:</span> ينتج عن انخفاض الضغط على جدران الشرايين. يتم تحديد انخفاض ضغط الدم من خلال قراءة ضغط دم أقل من <span class="highlight-text">95/60 ملم زئبق</span> أو <span class="highlight-text">20 إلى 30 ملم زئبق أقل</span> من الضغط الانقباضي الطبيعي للمريض.' },
                            { en: '<span class="highlight-text">Orthostatic hypotension</span> (postural hypotension): refers to a sudden drop of <span class="highlight-text">25 mmHg in systolic pressure</span> and <span class="highlight-text">10 mmHg in diastolic pressure</span> when the patient moves from a lying to a sitting or a sitting to a standing position.', ar: '<span class="highlight-text">انخفاض ضغط الدم الانتصابي</span> (الوضعي): يشير إلى انخفاض مفاجئ بمقدار <span class="highlight-text">25 ملم زئبق في الضغط الانقباضي</span> و <span class="highlight-text">10 ملم زئبق في الضغط الانبساطي</span> عندما ينتقل المريض من الاستلقاء إلى الجلوس أو من الجلوس إلى الوقوف.' }
                        ], 'القراءات غير الطبيعية:'),
                        tableCard('Categories for Blood Pressure Levels in Adults · فئات مستويات ضغط الدم للبالغين', `
                            <table class="info-table">
                                <thead><tr><th>Category · الفئة</th><th>Systolic · الانقباضي</th><th>Diastolic · الانبساطي</th></tr></thead>
                                <tbody>
                                    <tr><td>${cell('Normal', 'طبيعي')}</td><td>${cell('120', '120')}</td><td>${cell('80', '80')}</td></tr>
                                    <tr><td>${cell('Prehypertension', 'ما قبل ارتفاع الضغط')}</td><td>${cell('> 120–139', '> 120–139')}</td><td>${cell('> 80–89', '> 80–89')}</td></tr>
                                    <tr><td>${cell('High blood pressure: Stage 1 hypertension', 'ارتفاع ضغط الدم: ارتفاع ضغط المرحلة 1')}</td><td>${cell('140–159', '140–159')}</td><td>${cell('90–99', '90–99')}</td></tr>
                                    <tr><td>${cell('High blood pressure: Stage 2 hypertension', 'ارتفاع ضغط الدم: ارتفاع ضغط المرحلة 2')}</td><td>${cell('> 160', '> 160')}</td><td>${cell('> 100', '> 100')}</td></tr>
                                </tbody>
                            </table>
                        `, 'فئات الضغط:')
                    ]
                }
            ]
        };

        // ================================================================
        //  BUILD APP
        // ================================================================
        const slidesData = { fluid: fluidData, vitalSigns: vitalSignsData };
        const sectionOrder = ['fluid', 'vitalSigns'];

        function renderSlideContent(slide) {
            if (slide.cards && Array.isArray(slide.cards)) {
                return createSlideHTML(slide.title, slide.cards.join(''));
            }
            return createSlideHTML(slide.title, '');
        }

        function buildApp() {
            const tabsContainer = document.getElementById('tabsContainer');
            const sectionsContainer = document.getElementById('sectionsContainer');

            sectionOrder.forEach((secId, index) => {
                const sec = slidesData[secId];
                if (!sec) return;

                const tab = document.createElement('button');
                tab.className = 'tab-btn' + (index === 0 ? ' active' : '');
                tab.innerHTML = `<span class="en">${sec.titleEn}</span><span class="ar">${sec.titleAr}</span>`;
                tab.onclick = () => switchTab(secId, tab);
                tabsContainer.appendChild(tab);

                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (index === 0 ? ' active' : '');
                cardEl.id = `section-${secId}`;

                const slidesHTML = sec.slides.map(s => renderSlideContent(s)).join('');
                const totalSlides = sec.slides.length;

                cardEl.innerHTML = `
                    <h2>${sec.titleEn} · ${sec.titleAr}</h2>
                    <div style="text-align:center; margin-bottom:12px;">
                        <button class="pdf-btn" onclick="downloadPDF('${secId}')">📄 تحميل المحاضرة PDF</button>
                    </div>
                    <div class="slide-container" id="slideContainer-${secId}">
                        <div class="slide-progress">
                            <span style="font-weight:600;">التقدم</span>
                            <div class="bar"><div class="fill" style="width:0%;"></div></div>
                            <span class="count">1 / ${totalSlides}</span>
                        </div>
                        ${slidesHTML}
                        <div class="slide-nav">
                            <button class="btn-nav prev" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current - 1)">السابق</button>
                            <button class="btn-nav next primary" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current + 1)">التالي</button>
                        </div>
                    </div>
                `;
                sectionsContainer.appendChild(cardEl);

                initSlideState(secId, totalSlides);
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            });

            setTimeout(() => initTTS(), 200);
        }

        function switchTab(secId, tabEl) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(`section-${secId}`).classList.add('active');
            tabEl.classList.add('active');
        }

        // ================================================================
        //  INIT
        // ================================================================
        applyTheme(localStorage.getItem('theme') || 'dark');
        buildApp();

        window.goToSlide = goToSlide;
        window.slideState = slideState;
        window.toggleTheme = toggleTheme;
        window.toggleCardTranslation = toggleCardTranslation;
        window.downloadPDF = downloadPDF;
    </script>
</body>
</html>
