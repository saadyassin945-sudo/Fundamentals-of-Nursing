<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Fundamentals of Nursing </title>
    <style>
        /* ===== BASE ===== */
        :root {
            --bg1: #0a0e1a;
            --bg2: #141e33;
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --accent: #facc15;
            --danger: #f87171;
            --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5;
            --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px;
            --header-bg: rgba(255, 255, 255, 0.03);
            --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03);
            --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        [data-theme="light"] {
            --bg1: #f0f4f8;
            --bg2: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1);
            --text: #0f172a;
            --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7);
            --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04);
            --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
            --highlight-bg: #facc15;
            --highlight-text: #0f172a;
        }

        .highlight-text {
            background-color: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), #0f1a2b);
            min-height: 100vh;
            color: var(--text);
            padding: 16px 8px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.4s ease;
        }
        .app { max-width: 1100px; width: 100%; }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px 16px;
            background: var(--header-bg);
            border-radius: 20px;
            border: 1px solid var(--header-border);
            backdrop-filter: blur(4px);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15);
            transition: color 0.3s ease;
        }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .header .creator {
            color: var(--muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            transform: scale(1.05);
        }
        [data-theme="light"] .theme-toggle {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* ===== TABS ===== */
        .tabs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            line-height: 1.3;
        }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.08);
            color: var(--primary);
        }
        .tab-btn .en { display: block; font-size: 0.7rem; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.7; }

        /* ===== CARDS ===== */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow), var(--glow);
            padding: 18px 14px;
            margin-bottom: 16px;
            transition: background 0.3s ease, border 0.3s ease;
            display: none;
        }
        .card.active { display: block; }
        .card h2 {
            font-size: 1.3rem;
            color: var(--text);
            border-right: 4px solid var(--primary);
            padding-right: 12px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* ===== SLIDES ===== */
        .slide-container {
            position: relative;
            min-height: 300px;
        }
        .slide {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .slide.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .slide-progress .bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            margin: 0 12px;
            overflow: hidden;
        }
        .slide-progress .bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #818cf8);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .slide-progress .count {
            font-weight: 600;
            white-space: nowrap;
        }

        .slide-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .slide-nav .btn-nav {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 80px;
            text-align: center;
        }
        .slide-nav .btn-nav:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.08);
            border-color: var(--primary);
        }
        .slide-nav .btn-nav:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .slide-nav .btn-nav.primary {
            background: var(--primary);
            color: #0a0e1a;
            border-color: var(--primary);
        }
        .slide-nav .btn-nav.primary:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        [data-theme="light"] .slide-nav .btn-nav {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* ===== CARDS GRID ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            margin-bottom: 8px;
        }

        .topic-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 14px 12px;
            transition: border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .topic-card:hover { border-color: var(--primary); }

        .topic-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--card-title-bg);
        }
        .topic-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            line-height: 1.4;
            flex: 1;
        }
        .topic-card .card-title-ar {
            color: var(--muted);
            font-weight: 400;
            display: none;
        }
        .topic-card .card-title-ar.show { display: inline; }
        .topic-card .card-title-en { display: inline; }
        .topic-card .card-title-en.hidden { display: none; }

        .topic-card .translate-btn {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.6rem;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
            margin-right: 8px;
        }
        .topic-card .translate-btn:hover {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }
        .topic-card .translate-btn.active {
            background: rgba(0, 212, 255, 0.18);
            border-color: var(--primary);
        }

        .topic-card .card-items {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }
        .topic-card .card-items li {
            padding: 4px 0 4px 0;
            line-height: 1.6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        [data-theme="light"] .topic-card .card-items li {
            border-bottom-color: rgba(0, 0, 0, 0.04);
        }
        .topic-card .card-items li:last-child { border-bottom: none; }

        .topic-card .item-en {
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.6;
            display: block;
            text-align: left;
            direction: ltr;
        }
        .topic-card .item-ar {
            color: var(--muted);
            font-size: 0.82rem;
            line-height: 1.6;
            text-align: right;
            direction: rtl;
            display: none;
            margin-top: 2px;
            padding-right: 8px;
            border-right: 2px solid rgba(0, 212, 255, 0.2);
        }
        .topic-card .item-ar.show { display: block; }

        .topic-card .card-items.numbered {
            counter-reset: item-counter;
        }
        .topic-card .card-items.numbered li {
            padding-right: 28px;
            position: relative;
            counter-increment: item-counter;
        }
        .topic-card .card-items.numbered li::before {
            content: counter(item-counter) "-";
            position: absolute;
            right: 2px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* ===== TABLES ===== */
        .info-table-wrap {
            overflow-x: auto;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            grid-column: 1 / -1;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 500px;
        }
        .info-table th {
            background: var(--table-header-bg);
            color: var(--primary);
            padding: 8px 6px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            font-weight: 700;
        }
        .info-table td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--card-border);
            vertical-align: top;
            line-height: 1.5;
        }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text {
            border-right: none;
            padding-right: 0;
            margin-top: 2px;
            font-size: 0.78rem;
            display: block;
            color: var(--muted);
        }
        .info-table .en-text { font-size: 0.85rem; }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            .info-table { font-size: 0.72rem; min-width: 350px; }
            .topic-card .card-title { font-size: 0.85rem; }
        }

        .footer-credit {
            text-align: center;
            color: rgba(255, 255, 255, 0.12);
            font-size: 0.7rem;
            margin-top: 24px;
            padding: 10px 0;
            border-top: 1px solid var(--footer-border);
        }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit .name { color: var(--primary); font-weight: 600; }

        @media (max-width: 768px) {
            body { padding: 8px 4px; }
            .header h1 { font-size: 1.4rem; }
            .tab-btn { padding: 6px 10px; font-size: 0.6rem; }
            .card { padding: 14px 10px; }
            .card h2 { font-size: 1.1rem; }
        }

        .topic-card.full-width { grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1><span class="highlight">Fundamentals of Nursing</span></h1>
                    <div class="sub"> أساسيات تمريض نظري</div>
                    <div class="creator">Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">☀</button>
            </div>
        </div>

        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">
            Created by <span class="name">MR. YASSIN THARWAT</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  THEME
        // ================================================================
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☾' : '☀';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        // ================================================================
        //  SLIDE SYSTEM
        // ================================================================
        let slideState = {};

        function initSlideState(partId, totalSlides) {
            slideState[partId] = { current: 0, total: totalSlides };
        }

        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) progressBar.style.width = ((state.current + 1) / state.total * 100) + '%';
            if (countSpan) countSpan.textContent = `${state.current + 1} / ${state.total}`;
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }

        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        // ================================================================
        //  HELPERS
        // ================================================================
        function createSlideHTML(title, cardsHTML) {
            return `
                <div class="slide">
                    <h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3>
                    <div class="cards-grid">${cardsHTML}</div>
                </div>
            `;
        }

        function card(title, items, arTitle = '') {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `<li><span class="item-en">${en}</span><span class="item-ar">${ar}</span></li>`;
            }).join('');
            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';
            return `
                <div class="topic-card" data-card="${cardId}">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span>
                        </span>
                        <button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">ترجمة</button>
                    </div>
                    <ul class="${listClass}">${itemsHTML}</ul>
                </div>
            `;
        }

        function tableCard(title, tableHTML, arTitle = '') {
            return `
                <div class="topic-card full-width">
                    <div class="card-header">
                        <span class="card-title">
                            <span class="card-title-en">${title}</span>
                            <span class="card-title-ar" style="display:block;">${arTitle}</span>
                        </span>
                    </div>
                    <div class="info-table-wrap">${tableHTML}</div>
                </div>
            `;
        }

        function cell(en, ar) {
            return `<span class="en-text">${en}</span><span class="ar-text">${ar}</span>`;
        }

        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');
            arItems.forEach(el => el.classList.toggle('show'));
            if (titleAr) {
                titleAr.classList.toggle('show');
                if (titleEn) titleEn.classList.toggle('hidden');
            }
            if (btn) {
                btn.textContent = isVisible ? 'ترجمة' : 'إخفاء';
                btn.classList.toggle('active');
            }
        }

        // ================================================================
        //  DATA: FLUID & ELECTROLYTES LECTURE
        // ================================================================
        const fluidData = {
            titleEn: 'Lecture 1',
            titleAr: 'المحاضرة الأولى',
            slides: [
                {
                    title: 'Objectives · أهداف المحاضرة',
                    cards: [
                        card('At the end of this lecture, the student will be able to:', [
                            { en: '1. Identify normal body fluids and its function.', ar: '1. تحديد سوائل الجسم الطبيعية ووظائفها.' },
                            { en: '2. Identify normal electrolytes and its function.', ar: '2. تحديد الإلكتروليتات الطبيعية ووظائفها.' },
                            { en: '3. Describe normal distribution of body fluids.', ar: '3. وصف التوزيع الطبيعي لسوائل الجسم.' },
                            { en: '4. Describe the electrolytes in the body and their normal values.', ar: '4. وصف الإلكتروليتات في الجسم وقيمها الطبيعية.' },
                            { en: '5. Explain organs that maintain fluid and electrolytes balance.', ar: '5. شرح الأعضاء التي تحافظ على توازن السوائل والإلكتروليتات.' }
                        ], 'في نهاية هذه المحاضرة، سيكون الطالب قادراً على:')
                    ]
                },
                {
                    title: 'Fluid Balance · توازن السوائل',
                    cards: [
                        card('Amount and composition of body fluids · كمية وتكوين سوائل الجسم', [
                            { en: 'Approximately <span class="highlight-text">60%</span> of a typical adult\'s weight consists of fluid (water and electrolytes).', ar: 'حوالي <span class="highlight-text">60%</span> من وزن الشخص البالغ النموذجي يتكون من السوائل (ماء وإلكتروليتات).' },
                            { en: 'Total body water = 60% in a 220 lbs adult.', ar: 'إجمالي ماء الجسم = 60% في شخص بالغ وزنه 220 رطلاً.' },
                            { en: 'In obese individuals, total body water = 30% (fat contains little water).', ar: 'في الأفراد البدناء، إجمالي ماء الجسم = 30% (الدهون تحتوي على القليل من الماء).' }
                        ], 'كمية وتكوين سوائل الجسم:'),
                        card('Functions of body fluid (Maintain Homeostasis) · وظائف سوائل الجسم', [
                            { en: '1. <span class="highlight-text">Transports nutrients</span> to the cells and carries waste products from the cells.', ar: '1. <span class="highlight-text">نقل العناصر الغذائية</span> إلى الخلايا وحمل الفضلات من الخلايا.' },
                            { en: '2. Provides a <span class="highlight-text">medium</span> in which chemical reactions can occur.', ar: '2. توفير <span class="highlight-text">وسط</span> يمكن أن تحدث فيه التفاعلات الكيميائية.' },
                            { en: '3. Maintain <span class="highlight-text">acid-base balance</span> (balance between +cations Na+, K+ and - anions Cl- etc.).', ar: '3. الحفاظ على <span class="highlight-text">توازن الحمض والقاعدة</span> (التوازن بين الكاتيونات +Na+, K+ والأنيونات -Cl إلخ).' },
                            { en: '4. Assist in <span class="highlight-text">heat regulation</span> by evaporation.', ar: '4. المساعدة في <span class="highlight-text">تنظيم الحرارة</span> عن طريق التبخر.' },
                            { en: '5. <span class="highlight-text">Lubricates joints</span> and mucous membranes.', ar: '5. <span class="highlight-text">تزييت المفاصل</span> والأغشية المخاطية.' }
                        ], 'وظائف سوائل الجسم (الحفاظ على الاستقرار الداخلي):')
                    ]
                },
                {

                            { en: '<span class="highlight-text">Hypomagnesemia:</span> Magnesium deficit.', ar: '<span class="highlight-text">نقص المغنيسيوم:</span> عجز المغنيسيوم.' },
                            { en: '<span class="highlight-text">Hypermagnesemia:</span> Magnesium excess.', ar: '<span class="highlight-text">فرط المغنيسيوم:</span> زيادة المغنيسيوم.' }
                        ], 'تعريفات اختلالات الإلكتروليتات:')
                    ]
                },
                {
                    title: 'Clinical Manifestations of Calcium Imbalances · المظاهر السريرية لاختلالات الكالسيوم',
                    cards: [
                        card('HYPOCALCEMIA · نقص الكالسيوم', [
                            { en: '<span class="highlight-text">CNS and Muscular:</span> Anxiety, irritability; tetany, muscle twitching (Chvostek\'s sign); numbness and tingling; carpopedal spasm (Trousseau\'s sign); convulsions; abdominal and muscle cramps.', ar: '<span class="highlight-text">الجهاز العصبي المركزي والعضلي:</span> القلق، التهيج؛ تكزز، ارتعاش عضلي (علامة شفوستيك)؛ تنميل ووخز؛ تشنج رسغي قدمي (علامة تروسو)؛ تشنجات؛ تقلصات بطنية وعضلية.' },
                            { en: '<span class="highlight-text">Cardiac:</span> Weak contractions; ECG lengthened ST segment and prolonged QT interval.', ar: '<span class="highlight-text">القلب:</span> انقباضات ضعيفة؛ تخطيط القلب يظهر إطالة قطعة ST وإطالة فترة QT.' },
                            { en: '<span class="highlight-text">Blood:</span> Reduction in prothrombin (reduced clotting).', ar: '<span class="highlight-text">الدم:</span> انخفاض البروثرومبين (انخفاض التجلط).' },
                            { en: '<span class="highlight-text">Bone:</span> With prolonged deficiency — fractures occur easily.', ar: '<span class="highlight-text">العظام:</span> مع النقص المطول — تحدث الكسور بسهولة.' }
                        ], 'نقص الكالسيوم:'),
                        card('HYPERCALCEMIA · فرط الكالسيوم', [
                            { en: '<span class="highlight-text">CNS and Muscular:</span> Depression/apathy; weak, flabby muscles.', ar: '<span class="highlight-text">الجهاز العصبي المركزي والعضلي:</span> اكتئاب/لامبالاة؛ عضلات ضعيفة مترهلة.' },
                            { en: '<span class="highlight-text">Cardiac:</span> Signs of heart block; cardiac arrest in systole; decreased or diminished ST segment and shortened QT interval.', ar: '<span class="highlight-text">القلب:</span> علامات إحصار القلب؛ توقف القلب في الانقباض؛ انخفاض أو تضاؤل قطعة ST وقصر فترة QT.' },
                            { en: '<span class="highlight-text">Bone:</span> Pathologic fracture; deep pain over bony areas; thinning of bones.', ar: '<span class="highlight-text">العظام:</span> كسور مرضية؛ ألم عميق فوق مناطق العظام؛ ترقق العظام.' },
                            { en: '<span class="highlight-text">Renal:</span> Flank pain; calcium stones in kidney.', ar: '<span class="highlight-text">الكلى:</span> ألم في الخاصرة؛ حصوات كالسيوم في الكلى.' }
                        ], 'فرط الكالسيوم:')
                    ]
                },
                {
                    title: 'Clinical Manifestations of Potassium Imbalances · المظاهر السريرية لاختلالات البوتاسيوم',
                    cards: [
                        card('Hypokalemia · نقص البوتاسيوم', [
                            { en: '<span class="highlight-text">GI:</span> Anorexia, N/V, diarrhea, abdominal distention, decreased peristalsis or ileus.', ar: '<span class="highlight-text">الجهاز الهضمي:</span> فقدان الشهية، غثيان/قيء، إسهال، انتفاخ البطن، انخفاض الحركة الدودية أو انسداد معوي.' },
                            { en: '<span class="highlight-text">Cardiac:</span> Dysrhythmias, vertigo (dizziness), cardiac arrest.', ar: '<span class="highlight-text">القلب:</span> اضطرابات نظم القلب، دوار، توقف القلب.' },
                            { en: '<span class="highlight-text">ECG:</span> Flat or inverted T waves, depressed ST.', ar: '<span class="highlight-text">تخطيط القلب:</span> موجات T مسطحة أو مقلوبة، انخفاض ST.' },
                            { en: '<span class="highlight-text">Renal:</span> Polyuria.', ar: '<span class="highlight-text">الكلى:</span> كثرة البول.' },
                            { en: '<span class="highlight-text">Neuromuscular:</span> Malaise, drowsiness, muscular weakness, confusion, mental depression, diminished deep tendon reflexes, respiratory paralysis.', ar: '<span class="highlight-text">العصبي العضلي:</span> توعك، نعاس، ضعف عضلي، ارتباك، اكتئاب نفسي، انخفاض المنعكسات الوترية العميقة، شلل تنفسي.' },
                            { en: '<span class="highlight-text">Lab Values:</span> < 3.5 mEq/L; Alkalosis.', ar: '<span class="highlight-text">القيم المختبرية:</span> أقل من 3.5 ملي مكافئ/لتر؛ قلاء.' }
                        ], 'نقص البوتاسيوم:'),
                        card('Hyperkalemia · فرط البوتاسيوم', [
                            { en: '<span class="highlight-text">GI:</span> Nausea, diarrhea, abdominal cramps.', ar: '<span class="highlight-text">الجهاز الهضمي:</span> غثيان، إسهال، تقلصات بطنية.' },
                            { en: '<span class="highlight-text">Cardiac:</span> Tachycardia, then bradycardia and then cardiac arrest.', ar: '<span class="highlight-text">القلب:</span> تسرع القلب، ثم بطء القلب ثم توقف القلب.' },
                            { en: '<span class="highlight-text">ECG:</span> Peaked T waves, shortened QT interval, prolonged PR followed by disappearance of the P wave, prolonged QRS.', ar: '<span class="highlight-text">تخطيط القلب:</span> موجات T مدببة، قصر فترة QT، إطالة PR يتبعها اختفاء موجة P، إطالة QRS.' },
                            { en: '<span class="highlight-text">Renal:</span> Oliguria or anuria.', ar: '<span class="highlight-text">الكلى:</span> قلة البول أو انعدامه.' },
                            { en: '<span class="highlight-text">Neuromuscular:</span> Weakness, numbness or tingling sensation, muscle cramps.', ar: '<span class="highlight-text">العصبي العضلي:</span> ضعف، تنميل أو وخز، تقلصات عضلية.' },
                            { en: '<span class="highlight-text">Lab Values:</span> > 5.0 mEq/L; Acidosis.', ar: '<span class="highlight-text">القيم المختبرية:</span> أكثر من 5.0 ملي مكافئ/لتر؛ حماض.' }
                        ], 'فرط البوتاسيوم:')
                    ]
                }
            ]
        };

        // ================================================================
        //  BUILD APP
        // ================================================================
        const slidesData = { fluid: fluidData };
        const sectionOrder = ['fluid'];

        function renderSlideContent(slide) {
            if (slide.cards && Array.isArray(slide.cards)) {
                return createSlideHTML(slide.title, slide.cards.join(''));
            }
            return createSlideHTML(slide.title, '');
        }

        function buildApp() {
            const tabsContainer = document.getElementById('tabsContainer');
            const sectionsContainer = document.getElementById('sectionsContainer');

            sectionOrder.forEach((secId) => {
                const sec = slidesData[secId];
                if (!sec) return;

                const tab = document.createElement('button');
                tab.className = 'tab-btn active';
                tab.innerHTML = `<span class="en">${sec.titleEn}</span><span class="ar">${sec.titleAr}</span>`;
                tabsContainer.appendChild(tab);

                const cardEl = document.createElement('div');
                cardEl.className = 'card active';
                cardEl.id = `section-${secId}`;

                const slidesHTML = sec.slides.map(s => renderSlideContent(s)).join('');
                const totalSlides = sec.slides.length;

                cardEl.innerHTML = `
                    <h2>${sec.titleEn} · ${sec.titleAr}</h2>
                    <div class="slide-container" id="slideContainer-${secId}">
                        <div class="slide-progress">
                            <span style="font-weight:600;">التقدم</span>
                            <div class="bar"><div class="fill" style="width:0%;"></div></div>
                            <span class="count">1 / ${totalSlides}</span>
                        </div>
                        ${slidesHTML}
                        <div class="slide-nav">
                            <button class="btn-nav prev" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current - 1)">السابق</button>
                            <button class="btn-nav next primary" onclick="goToSlide('${secId}', 'slideContainer-${secId}', slideState['${secId}'].current + 1)">التالي</button>
                        </div>
                    </div>
                `;
                sectionsContainer.appendChild(cardEl);

                initSlideState(secId, totalSlides);
                setTimeout(() => renderSlide(secId, `slideContainer-${secId}`), 50);
            });
        }

        // ================================================================
        //  INIT
        // ================================================================
        applyTheme(localStorage.getItem('theme') || 'dark');
        buildApp();

        window.goToSlide = goToSlide;
        window.slideState = slideState;
        window.toggleTheme = toggleTheme;
        window.toggleCardTranslation = toggleCardTranslation;
    </script>
</body>
</html>
